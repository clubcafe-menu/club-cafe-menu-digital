name: Sync Google Sheet
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-sheet.mjs
      - name: Commit si changement
        run: |
          if [ -n "$(git status --porcelain js/snapshot.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/snapshot.js
            git commit -m "Mise à jour du menu depuis Google Sheets"
            git push
          fi
